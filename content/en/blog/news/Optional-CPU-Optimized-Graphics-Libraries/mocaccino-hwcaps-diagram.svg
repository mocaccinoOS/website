<svg width="100%" viewBox="0 0 680 500" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>How MocaccinoOS selects the right library for your CPU</title>
  <desc>An app launches, the dynamic linker checks CPU capabilities, then loads either the optimized x86-64-v3 libraries or the standard baseline libraries, and the app runs the same either way.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- A: App launches -->
  <rect x="180" y="20" width="320" height="44" rx="8" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="1"/>
  <text x="340" y="42" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">App or game launches</text>

  <line x1="340" y1="64" x2="340" y2="100" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- B: linker checks CPU -->
  <rect x="140" y="100" width="400" height="56" rx="8" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="1"/>
  <text x="340" y="120" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">Dynamic linker</text>
  <text x="340" y="138" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#5F5E5A">checks CPU capabilities</text>

  <path d="M340 156 V188 H190 V220" fill="none" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)"/>
  <path d="M340 156 V188 H490 V220" fill="none" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- C1: v3 capable -->
  <rect x="80" y="220" width="220" height="56" rx="8" fill="#F3E6DC" stroke="#cb9b7a" stroke-width="1"/>
  <text x="190" y="240" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#5C3A24">CPU supports x86-64-v3</text>
  <text x="190" y="258" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#8A5A38">AVX2, FMA, BMI2 present</text>

  <!-- C2: baseline -->
  <rect x="380" y="220" width="220" height="56" rx="8" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="1"/>
  <text x="490" y="240" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">Any other CPU</text>
  <text x="490" y="258" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#5F5E5A">Baseline x86-64-v1</text>

  <line x1="190" y1="276" x2="190" y2="310" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="490" y1="276" x2="490" y2="310" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- D1: optimized libs -->
  <rect x="80" y="310" width="220" height="56" rx="8" fill="#F3E6DC" stroke="#cb9b7a" stroke-width="1"/>
  <text x="190" y="330" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#5C3A24">Optimized libraries used</text>
  <text x="190" y="348" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#8A5A38">glibc-hwcaps/x86-64-v3</text>

  <!-- D2: standard libs -->
  <rect x="380" y="310" width="220" height="56" rx="8" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="1"/>
  <text x="490" y="330" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">Standard libraries used</text>
  <text x="490" y="348" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#5F5E5A">Always present, unchanged</text>

  <path d="M190 366 V384 H260 V400" fill="none" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)"/>
  <path d="M490 366 V384 H420 V400" fill="none" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- E: converge -->
  <rect x="180" y="400" width="320" height="56" rx="8" fill="#EDEBE3" stroke="#888780" stroke-width="1"/>
  <text x="340" y="420" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">Graphics and media stack runs</text>
  <text x="340" y="438" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#5F5E5A">Same experience either way</text>
</svg>
