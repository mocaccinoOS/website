<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 530" width="820" height="530" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">How sched_ext fits into the Linux kernel</title>
  <desc id="d">Programs in user space are scheduled onto CPU cores by the kernel's default scheduler, EEVDF. An optional scx scheduler, started from user space, loads a BPF program into sched_ext and takes over. If it stops or fails, the kernel falls back to the default scheduler.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
  </defs>

  <rect x="1" y="1" width="818" height="528" rx="14" fill="#ffffff" stroke="#d0d7de" stroke-width="2"/>
  <text x="410" y="36" text-anchor="middle" font-size="21" font-weight="700" fill="#1f2937">How sched_ext fits in</text>

  <!-- USER SPACE -->
  <rect x="30" y="56" width="760" height="130" rx="10" fill="#f0f4f8" stroke="#b6c2cf" stroke-width="1.5"/>
  <text x="46" y="78" font-size="12" font-weight="700" letter-spacing="1.5" fill="#64748b">USER SPACE</text>

  <rect x="60" y="92" width="250" height="70" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/>
  <text x="185" y="120" text-anchor="middle" font-size="16" font-weight="700" fill="#1f2937">Your programs</text>
  <text x="185" y="142" text-anchor="middle" font-size="13" fill="#475569">games, desktop apps, compilers</text>

  <rect x="490" y="92" width="270" height="70" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="625" y="120" text-anchor="middle" font-size="16" font-weight="700" fill="#1f2937">scx scheduler (opt-in)</text>
  <text x="625" y="142" text-anchor="middle" font-size="13" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" fill="#166534">sudo scx_lavd</text>

  <!-- KERNEL -->
  <rect x="30" y="226" width="760" height="190" rx="10" fill="#f8f5ee" stroke="#cbbf9f" stroke-width="1.5"/>
  <text x="46" y="248" font-size="12" font-weight="700" letter-spacing="1.5" fill="#8a7a4d">KERNEL</text>
  <text x="397" y="270" text-anchor="middle" font-size="14" fill="#475569">Decides which task runs on which core, and when</text>

  <rect x="60" y="286" width="300" height="96" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
  <text x="210" y="318" text-anchor="middle" font-size="16" font-weight="700" fill="#1e3a8a">Default scheduler (EEVDF)</text>
  <text x="210" y="342" text-anchor="middle" font-size="13" fill="#1e40af">What you get out of the box</text>
  <text x="210" y="362" text-anchor="middle" font-size="13" font-style="italic" fill="#1e40af">active unless you load another</text>

  <rect x="460" y="286" width="300" height="96" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="610" y="318" text-anchor="middle" font-size="16" font-weight="700" fill="#14532d">sched_ext</text>
  <text x="610" y="342" text-anchor="middle" font-size="13" fill="#166534">Runs the scheduler you loaded</text>
  <text x="610" y="362" text-anchor="middle" font-size="13" font-style="italic" fill="#166534">a BPF program, no reboot needed</text>

  <!-- arrows -->
  <line x1="185" y1="162" x2="185" y2="224" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="197" y="199" font-size="13" fill="#374151">tasks to schedule</text>

  <line x1="610" y1="162" x2="610" y2="284" stroke="#16a34a" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="622" y="206" font-size="13" fill="#166534">loads a BPF program</text>

  <line x1="458" y1="334" x2="362" y2="334" stroke="#374151" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <text x="410" y="324" text-anchor="middle" font-size="13" fill="#374151">fallback</text>

  <text x="410" y="404" text-anchor="middle" font-size="13" fill="#475569">If the scheduler stops, hits an error, or you reboot, the kernel returns to the default on its own.</text>

  <!-- cores -->
  <line x1="410" y1="416" x2="410" y2="450" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/>
  <g fill="#e2e8f0" stroke="#64748b" stroke-width="1.5">
    <rect x="291" y="458" width="28" height="28" rx="4"/>
    <rect x="333" y="458" width="28" height="28" rx="4"/>
    <rect x="375" y="458" width="28" height="28" rx="4"/>
    <rect x="417" y="458" width="28" height="28" rx="4"/>
    <rect x="459" y="458" width="28" height="28" rx="4"/>
    <rect x="501" y="458" width="28" height="28" rx="4"/>
  </g>
  <text x="410" y="512" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2937">CPU cores</text>
</svg>
